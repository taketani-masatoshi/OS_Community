# Static receipt verify portal → Vercel Hobby (receipt.oorgos.org).
# Secret: VERCEL_TOKEN (Hobby team OpenOrgOS).
name: Deploy receipt.oorgos.org

on:
  push:
    branches: [main, master]
    paths:
      - "sites/receipt/**"
      - ".github/workflows/deploy-receipt.yml"
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    env:
      VERCEL_ORG_ID: team_EDHBX07Ks9m5WsF2hbOV1GMY
      VERCEL_PROJECT_ID: prj_f9dAtTIkqr8JR7QHWGywEHEweB7H
    defaults:
      run:
        working-directory: sites/receipt
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Vercel CLI
        run: npm install -g vercel@59.9.1

      - name: Pull project settings
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel pull --yes --environment=production --token="$VERCEL_TOKEN"

      - name: Deploy production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: vercel deploy --prod --yes --token="$VERCEL_TOKEN"
