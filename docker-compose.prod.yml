services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-oscommunity}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-oscommunity}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oscommunity}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      target: runner
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-oscommunity}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-oscommunity}
      AUTH_SECRET: ${AUTH_SECRET}
      AUTH_URL: https://${DOMAIN}
      AUTH_GITHUB_ID: ${AUTH_GITHUB_ID}
      AUTH_GITHUB_SECRET: ${AUTH_GITHUB_SECRET}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      AUTH_LINKEDIN_ID: ${AUTH_LINKEDIN_ID:-}
      AUTH_LINKEDIN_SECRET: ${AUTH_LINKEDIN_SECRET:-}
      NEXT_PUBLIC_SITE_URL: https://${DOMAIN}
      CONTENT_ROOT: /app/content
      ACADEMY_API_URL: ${ACADEMY_API_URL:-}
      ACADEMY_INTERNAL_TOKEN: ${ACADEMY_INTERNAL_TOKEN:-}
      STEWARD_REPO_PATH: ${STEWARD_REPO_PATH:-}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 120s
    restart: unless-stopped

  caddy:
    image: caddy:2-alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    environment:
      DOMAIN: ${DOMAIN}
    depends_on:
      web:
        condition: service_healthy
    restart: unless-stopped

volumes:
  pgdata:
  caddy_data:
  caddy_config:
