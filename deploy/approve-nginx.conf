server {
  listen 80;
  server_name localhost;
  root /usr/share/nginx/html;
  index index.html;

  # Settlement PassKey static site (ADR 0037 · localhost)
  location = /enroll {
    try_files /enroll.html =404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }

  location ~* \.(js|css|png|svg|ico|woff2?)$ {
    expires 1h;
    add_header Cache-Control "public";
    try_files $uri =404;
  }
}
