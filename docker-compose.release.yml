# Pull-based beta deploy (GHCR). See docs/beta-operations.md
#   docker compose -f docker-compose.release.yml pull && docker compose -f docker-compose.release.yml up -d
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-oscommunity}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-oscommunity}
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-oscommunity}"]
      interval: 10s
      timeout: 5s
      retries: 5

  web:
    image: ${WEB_IMAGE:-ghcr.io/taketani-masatoshi/os-community-web}:${IMAGE_TAG:-beta}
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-oscommunity}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-oscommunity}
      AUTH_SECRET: ${AUTH_SECRET:?Set AUTH_SECRET}
      AUTH_URL: ${AUTH_URL:-https://${DOMAIN}}
      AUTH_GITHUB_ID: ${AUTH_GITHUB_ID:-}
      AUTH_GITHUB_SECRET: ${AUTH_GITHUB_SECRET:-}
      AUTH_GOOGLE_ID: ${AUTH_GOOGLE_ID:-}
      AUTH_GOOGLE_SECRET: ${AUTH_GOOGLE_SECRET:-}
      AUTH_LINKEDIN_ID: ${AUTH_LINKEDIN_ID:-}
      AUTH_LINKEDIN_SECRET: ${AUTH_LINKEDIN_SECRET:-}
      NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-https://${DOMAIN}}
      CONTENT_ROOT: /app/content
      ACADEMY_API_URL: ${ACADEMY_API_URL:-}
      ACADEMY_INTERNAL_TOKEN: ${ACADEMY_INTERNAL_TOKEN:-}
      OPENORGOS_CHANNEL_URL: ${OPENORGOS_CHANNEL_URL:-}
      APP_CHANNEL: beta
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/api/health >/dev/null 2>&1 || exit 1"]
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 90s
    restart: unless-stopped

volumes:
  pgdata:
